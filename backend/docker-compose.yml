version: "3.9"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dev_1
      POSTGRES_PASSWORD: dev_1
      POSTGRES_DB: appdb_1
    volumes:
      - postgres_data_1:/var/lib/postgresql/data

volumes:
  postgres_data_1:
